# The data repo's own checks on every push and PR (spec §5.7): schema validation, by-length/
# equals what the generator produces from the inputs, and entries/ and tags/ are append-only.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Schema, generated files, append-only
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          node tools/src/cli/ci-check.ts ${base:+--base "$base"}
