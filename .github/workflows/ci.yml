# The data repo's own checks on every push and PR (spec §5.7): schema validation, by-length/
# equals what the generator produces from the inputs, and entries/ and tags/ are append-only.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node, npm ci and forge (the publish bookkeeping test builds a tiny repo with forge).
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm test
      - name: Schema, generated files, append-only
        # Event fields reach the script through env, never pasted into it (a branch name is free text).
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            base=""
          fi
          node tools/src/cli/ci-check.ts ${base:+--base "$base"}
