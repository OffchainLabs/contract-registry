name: Set up registry tooling
description: Node, yarn, Foundry (forge and anvil) and the registry's work caches
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    # The one toolchain for every source's build profiles (`toolchain` in each
    # config/<source>/sources.json): Node 24, Foundry v1.9.0 and yarn 1.22.22. The builder
    # doesn't install per-profile toolchains, so a profile that needs another version must be
    # installed here (Hardhat downloads its own solc). Used by publish, reconcile, rebuild and ci.
    - uses: foundry-rs/foundry-toolchain@v1
      with:
        version: v1.9.0
        cache: false
    - shell: bash
      run: npm install -g yarn@1.22.22 && npm ci
    - uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/registry-work/results
          ${{ runner.temp }}/registry-work/checks
          ${{ runner.temp }}/registry-work/sources
        key: registry-work-${{ github.run_id }}
        restore-keys: registry-work-
